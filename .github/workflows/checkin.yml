name: GLaDOS 2026 Checkin

on:
  schedule:
    # 每天北京时间 11:30（UTC 03:30）只读核对状态并微信提醒
    # 只查剩余天数、积分与今日是否已签到并附上签到链接，不提交自动签到，避免触发 Turnstile 报错。
    # 如官方撤下验证且希望恢复定时自动签到，可将仓库变量 ALLOW_SCHEDULED_CHECKIN 设为 true。
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean
      notify_status_only:
        description: 只读取剩余天数、积分与今日签到状态并发送通知（含签到链接），不发起签到请求、不自动兑换
        required: false
        default: true
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin (read-only status reminder)
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          # Prefer the repository Variable; accept a same-named Secret for compatibility.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
          # 默认采用只读状态与微信提醒模式（不发起签到请求，不触发 Turnstile）；
          # 手动运行(manual)且取消勾选 notify_status_only，或设仓库变量 ALLOW_SCHEDULED_CHECKIN=true 时才尝试完整签到。
          CHECKIN_NOTIFY_STATUS_ONLY: ${{ ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_source != 'manual')) && (vars.ALLOW_SCHEDULED_CHECKIN || '') != 'true') && 'true' || (inputs.notify_status_only && 'true' || 'false') }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
